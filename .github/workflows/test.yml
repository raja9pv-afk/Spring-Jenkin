name: Run Tests

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
  deploy:
     runs-on: ubuntu-latest  

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Tests
        run: mvn clean test

      - name: Run Application
        run: mvn spring-boot:run &
             sleep 20

      - name: Deploy (Trigger)
        run: echo "Deploying application..."
